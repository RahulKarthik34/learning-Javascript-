<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> DEV OS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="boot-screen">

        <h1> WELCOME TO NEW OS</h1>
        <p> setting up your system........</p>
        <div class="loading-bar">
            <div class="loading-process"></div>
            <div class="loading-circle"></div>
        </div>
    </div>

    <div id="login-screen">
        <h1> HELLO WELCOME BACK </h1>
        <input type="password" placeholder="                    ************" id="password1">
        <button id="login-btn"> SUBMIT</button>
    </div>

    <div id="desktop-screen">
        <div class="disktop-icons">
            <div class="icon">
                <span>🌩️</span>
                <p> weather</p>
            </div>

            <div class="icon">
                <span>🎥</span>
                <p> camara</p>
            </div>
            <div class="icon">
                <span>🕓</span>
                <p> clock</p>
            </div>
            <div class="icon">
                <span>🌐</span>
                <p> internet</p>
            </div>
            <div class="icon">
                <span>🏎️</span>
                <p> uber</p>
            </div>
            <div class="icon" id="notes-icon">
                <span>🗒️</span>
                <p> notepad</p>
            </div>
            <div id="notes-window">

                <div id="notes-header">
                    <h2>📝 Notepad</h2>
                    <button id="notes-close">❌</button>
                </div>

                <textarea id="notes-text" placeholder="Write your notes here..."></textarea>
                <button id="save-b">💾 Save</button>
            </div>

        </div>
        <div class="taskbar">

            <div class="taskbar-icons">
                <input type="text" placeholder="search" id="serch1">
                <a href="#">❤️</a>
                <a href="#">⭐</a>
                <a href="#">🎁</a>
                <a href="#">🏚️</a>
                <a href="#">🚝</a>
            </div>
        </div>
    </div>

    <script src="js/function.js"></script>
</body>

</html>
